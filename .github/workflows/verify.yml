name: Verify and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.8'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Report environment
        shell: pwsh
        run: |
          python --version
          $PSVersionTable
          [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
      - name: Test
        run: python -B -m unittest -v

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -B scripts/build_release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
